[project]
name = "ai4research"
version = "0.1.0"
description = "Pipeline A — Phase 0: a deterministic, file-first, source-agnostic research-compiler skeleton."
requires-python = ">=3.10"
dependencies = []  # standard library only — no network, no API keys

[project.scripts]
ai4research = "ai4research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["ai4research"]
